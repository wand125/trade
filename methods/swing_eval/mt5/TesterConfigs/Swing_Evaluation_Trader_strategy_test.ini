FromDate=2026.06.30
ToDate=2026.07.08
ForwardMode=3
Deposit=10000
Currency=USD
Leverage=1:100
UseLocal=1
UseRemote=0
UseCloud=0
Visual=0
Report=Tester\Swing_Evaluation_Trader_strategy_test
ReplaceReport=1
ShutdownTerminal=0
