[project]
name = "trade-data"
version = "0.1.0"
description = "Historical XAUUSD data pipeline for short-term trade modelling"
requires-python = ">=3.10"
dependencies = [
  "catboost>=1.2,<2",
  "lightgbm>=4,<5",
  "numpy>=1.26,<2",
  "pandas>=2.2,<3",
  "pyarrow>=16.0",
  "requests>=2.32",
  "scikit-learn>=1.5,<1.8",
  "scipy>=1.13,<1.16",
  "torch>=2.2,<2.3; platform_system == 'Darwin' and platform_machine == 'x86_64'",
  "torch>=2.4; platform_system != 'Darwin' or platform_machine != 'x86_64'",
  "xgboost>=2.1,<4",
]

[dependency-groups]
dev = [
  "pytest>=8",
]

[project.scripts]
trade-histdata = "trade_data.histdata:main"
trade-convert = "trade_data.convert:main"
trade-validate = "trade_data.validate:main"
trade-backtest = "trade_data.backtest:main"
trade-dataset = "trade_data.dataset:main"
trade-model = "trade_data.modeling:main"
trade-meta = "trade_data.meta_model:main"
trade-next-bar = "trade_data.next_bar:main"
trade-next-bar-ensemble = "trade_data.next_bar_ensemble:main"
trade-next-bar-disagreement = "trade_data.next_bar_disagreement:main"
trade-next-bar-online-ensemble = "trade_data.next_bar_online_ensemble:main"
trade-next-bar-meta = "trade_data.next_bar_meta:main"
trade-next-bar-ev = "trade_data.next_bar_ev:main"
trade-next-bar-overlay = "trade_data.next_bar_overlay:main"
trade-next-bar-entry-delay = "trade_data.next_bar_entry_delay:main"

[tool.pytest.ini_options]
pythonpath = ["src", ".", "methods/entry_ev", "methods/swing_eval"]
python_functions = ["test_*"]
testpaths = ["tests", "methods/entry_ev/tests", "methods/swing_eval/tests"]
